
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>QUÉT QR CCCD - PHÁT BẰNG</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:16px;
  font-family:Arial,sans-serif;
  background:#eef2f7;
  color:#172033;
}
.container{
  max-width:520px;
  margin:auto;
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 25px #00000012;
}
h2{
  text-align:center;
  font-size:21px;
  color:#1457a6;
  margin:5px 0 8px;
}
.sub{
  text-align:center;
  color:#64748b;
  font-size:13px;
  margin-bottom:18px;
}
.camera-box{
  position:relative;
  width:100%;
  max-width:340px;
  height:250px;
  margin:0 auto 15px;
  overflow:hidden;
  border-radius:14px;
  background:#101827;
  display:flex;
  align-items:center;
  justify-content:center;
}
video{
  width:100%;
  height:100%;
  object-fit:cover;
}
.frame{
  position:absolute;
  width:68%;
  height:68%;
  border:3px solid #20df85;
  border-radius:14px;
  pointer-events:none;
  box-shadow:0 0 0 1000px #00000025;
}
.camera-placeholder{
  position:absolute;
  color:white;
  font-size:14px;
  text-align:center;
  padding:15px;
  pointer-events:none;
}
button,.file-label{
  border:0;
  border-radius:11px;
  padding:14px 10px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  display:block;
  width:100%;
  margin-top:10px;
}
.primary{background:#1266cc;color:white}
.success{background:#0b9560;color:white}
.secondary{background:#e8eef6;color:#24364b}
.warning{background:#f0a51b;color:#222}
button:disabled{opacity:.5;cursor:not-allowed}
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.controls button{margin-top:0}
.status{
  margin-top:15px;
  padding:13px;
  background:#f1f5f9;
  border-radius:10px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.status.ok{background:#dcfce7;color:#166534}
.status.error{background:#fee2e2;color:#991b1b}
.zoom-area{
  margin-top:15px;
  display:none;
}
.zoom-area input{width:100%}
.file-label{
  background:#e8eef6;
  color:#24364b;
  text-align:center;
}
input[type=file]{display:none}
.note{
  font-size:12px;
  color:#64748b;
  text-align:center;
  line-height:1.5;
  margin-top:14px;
}
</style>
</head>

<body>
<div class="container">

<h2>QUÉT MÃ QR CCCD</h2>
<div class="sub">HỆ THỐNG TRA CỨU VÀ PHÁT BẰNG TỐT NGHIỆP</div>

<div class="camera-box">
  <video id="video" autoplay muted playsinline></video>
  <div class="camera-placeholder" id="placeholder">
    Nhấn MỞ CAMERA để bắt đầu
  </div>
  <div class="frame"></div>
</div>

<button class="primary" id="startBtn" onclick="startCamera()">
  MỞ CAMERA
</button>

<button class="success" id="captureBtn" onclick="captureAndRead()" disabled>
  CHỤP ẢNH ĐỌC QR
</button>

<div class="controls">
  <button class="secondary" id="flashBtn" onclick="toggleFlash()" disabled>
    BẬT ĐÈN FLASH
  </button>
  <button class="secondary" onclick="switchCamera()">
    ĐỔI CAMERA
  </button>
</div>

<div class="zoom-area" id="zoomArea">
  <label for="zoom">Điều chỉnh độ phóng đại</label>
  <input type="range" id="zoom" min="1" max="3" step="0.1"
         oninput="changeZoom(this.value)">
</div>

<label class="file-label" for="imageInput">
  CHỌN ẢNH QR TRONG THIẾT BỊ
</label>
<input type="file" id="imageInput" accept="image/*"
       onchange="readImage(this)">

<div id="status" class="status">
  Sẵn sàng. Mở camera hoặc chọn ảnh QR để đọc.
</div>

<div class="note">
  Hỗ trợ camera điện thoại, webcam máy tính và ảnh QR có sẵn.
  Camera yêu cầu trang web chạy bằng HTTPS.
</div>

</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
const WEB_APP_URL =
'https://script.google.com/macros/s/AKfycbywXvRGwJxCMw8FDcrMQWJ0LRPDjwKJn8zwG6MCaxEz1Jj6QOR7brTNF7LvnFRA2XtbBA/exec';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const statusBox = document.getElementById('status');

let stream = null;
let track = null;
let facing = 'environment';
let flashOn = false;
let busy = false;
let codeReader = new ZXingBrowser.BrowserMultiFormatReader();

function status(message,type=''){
  statusBox.className='status '+type;
  statusBox.textContent=message;
}

async function startCamera(){
  stopCamera();

  try{
    status('Đang mở camera...');

    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:facing},
        width:{ideal:1920},
        height:{ideal:1080}
      }
    });

    video.srcObject=stream;
    await video.play();

    track=stream.getVideoTracks()[0];

    try{
      const caps=track.getCapabilities();
      const constraints={};

      if(caps.focusMode && caps.focusMode.includes('continuous')){
        constraints.focusMode='continuous';
      }

      if(Object.keys(constraints).length){
        await track.applyConstraints({advanced:[constraints]});
      }

      if(caps.zoom){
        const zoom=document.getElementById('zoom');
        zoom.min=caps.zoom.min;
        zoom.max=Math.min(caps.zoom.max,3);
        zoom.step=caps.zoom.step || 0.1;
        zoom.value=caps.zoom.min;
        document.getElementById('zoomArea').style.display='block';
      }else{
        document.getElementById('zoomArea').style.display='none';
      }

      document.getElementById('flashBtn').disabled=!caps.torch;
    }catch(e){
      document.getElementById('flashBtn').disabled=true;
    }

    document.getElementById('placeholder').style.display='none';
    document.getElementById('captureBtn').disabled=false;
    document.getElementById('startBtn').textContent='MỞ LẠI CAMERA';

    status('Camera đã sẵn sàng. Đưa QR vào khung rồi bấm CHỤP ẢNH ĐỌC QR.','ok');

  }catch(e){
    status('Không mở được camera. Hãy cấp quyền camera và kiểm tra HTTPS. Chi tiết: '+e.message,'error');
  }
}

function stopCamera(){
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
    track=null;
  }
  video.srcObject=null;
  flashOn=false;
  document.getElementById('captureBtn').disabled=true;
  document.getElementById('flashBtn').disabled=true;
  document.getElementById('zoomArea').style.display='none';
  document.getElementById('placeholder').style.display='block';
}

async function switchCamera(){
  facing=facing==='environment'?'user':'environment';
  await startCamera();
}

async function toggleFlash(){
  if(!track)return;

  try{
    const caps=track.getCapabilities();
    if(!caps.torch)return;

    flashOn=!flashOn;
    await track.applyConstraints({
      advanced:[{torch:flashOn}]
    });

    document.getElementById('flashBtn').textContent=
      flashOn?'TẮT ĐÈN FLASH':'BẬT ĐÈN FLASH';
  }catch(e){
    status('Thiết bị hoặc trình duyệt không hỗ trợ đèn flash.','error');
  }
}

async function changeZoom(value){
  if(!track)return;
  try{
    await track.applyConstraints({
      advanced:[{zoom:Number(value)}]
    });
  }catch(e){}
}

function extractId(raw){
  const value=String(raw||'').trim();

  const first=value.split('|')[0].trim();
  const direct=first.replace(/\D/g,'');

  if(/^\d{12}$/.test(direct))return direct;

  const match=value.match(/(?:^|\D)(\d{12})(?:\D|$)/);
  return match?match[1]:null;
}

async function decodeCanvas(){
  const width=video.videoWidth;
  const height=video.videoHeight;

  if(!width || !height){
    throw new Error('Camera chưa có hình ảnh.');
  }

  canvas.width=width;
  canvas.height=height;

  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,width,height);

  const result=await codeReader.decodeFromCanvas(canvas);
  return result.getText();
}

async function captureAndRead(){
  if(busy)return;
  busy=true;

  try{
    status('Đang đọc mã QR...');
    const raw=await decodeCanvas();
    handleResult(raw);
  }catch(e){
    status('Chưa đọc được QR. Hãy giữ điện thoại ổn định, đưa mã vào khung và chụp lại.','error');
  }finally{
    busy=false;
  }
}

async function readImage(input){
  const file=input.files && input.files[0];
  if(!file)return;

  if(busy)return;
  busy=true;

  try{
    status('Đang đọc QR từ ảnh...');
    const result=await codeReader.decodeFromImageUrl(URL.createObjectURL(file));
    handleResult(result.getText());
  }catch(e){
    status('Không tìm thấy mã QR trong ảnh. Vui lòng chọn ảnh rõ nét hơn.','error');
  }finally{
    busy=false;
    input.value='';
  }
}

function beep(){
  try{
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    const audio=new AudioContext();
    const oscillator=audio.createOscillator();
    const gain=audio.createGain();

    oscillator.frequency.value=1200;
    gain.gain.value=0.15;

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();
    oscillator.stop(audio.currentTime+0.18);
  }catch(e){}
}

function handleResult(raw){
  const id=extractId(raw);

  if(!id){
    status('Đã đọc QR nhưng không tìm thấy CCCD gồm 12 chữ số.','error');
    return;
  }

  beep();
  status('ĐỌC THÀNH CÔNG! CCCD: '+id+'. Đang chuyển sang tra cứu...','ok');

  const form=document.createElement('form');
  form.method='POST';
  form.action=WEB_APP_URL;
  form.target='_self';

  const field=document.createElement('input');
  field.type='hidden';
  field.name='id';
  field.value=id;

  form.appendChild(field);
  document.body.appendChild(form);
  form.submit();
}

if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
  status('Trình duyệt không hỗ trợ camera hoặc trang web chưa chạy HTTPS.','error');
}
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUÉT QR CCCD - PHÁT BẰNG</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:15px;
  font-family:Arial,sans-serif;
  background:#eef2f7;color:#172033
}
.container{
  max-width:500px;margin:auto;
  background:white;padding:20px;
  border-radius:18px;
  box-shadow:0 5px 25px #00000012
}
h2{text-align:center;color:#1457a6;font-size:21px}
.sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:18px}
#reader{
  width:100%;max-width:400px;
  margin:auto;overflow:hidden;
  border-radius:14px;
  background:#111827;
  min-height:260px
}
#reader video{
  width:100%!important;
  border-radius:12px
}
button,.file-label{
  width:100%;padding:14px 10px;
  border:0;border-radius:10px;
  font-size:15px;font-weight:bold;
  margin-top:10px;cursor:pointer
}
.primary{background:#1266cc;color:white}
.success{background:#0b9560;color:white}
.secondary{background:#e8eef6;color:#24364b}
.danger{background:#dc3545;color:white}
button:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid button{margin-top:10px}
.file-label{
  display:block;text-align:center;
  background:#e8eef6;color:#24364b
}
input[type=file]{display:none}
.status{
  margin-top:15px;padding:13px;
  border-radius:10px;background:#f1f5f9;
  text-align:center;font-size:14px;line-height:1.5;
  overflow-wrap:anywhere
}
.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.note{
  font-size:12px;color:#64748b;
  text-align:center;line-height:1.5;margin-top:15px
}
#reader__dashboard_section_csr button{
  background:#1266cc;color:white;
  border-radius:8px;padding:10px
}
#reader__dashboard_section_csr select{
  max-width:100%;padding:8px;border-radius:7px
}
</style>
</head>

<body>
<div class="container">

<h2>QUÉT MÃ QR CCCD</h2>
<div class="sub">HỆ THỐNG TRA CỨU VÀ PHÁT BẰNG TỐT NGHIỆP</div>

<div id="reader"></div>

<button class="primary" id="startBtn" onclick="startScanner()">
MỞ CAMERA VÀ QUÉT LIÊN TỤC
</button>

<div class="grid">
<button class="secondary" onclick="switchCamera()">ĐỔI CAMERA</button>
<button class="danger" onclick="stopScanner()">DỪNG CAMERA</button>
</div>

<label class="file-label" for="imageInput">
CHỌN ẢNH QR TRONG THIẾT BỊ
</label>
<input type="file" id="imageInput" accept="image/*" onchange="readImage(this)">

<div id="status" class="status">
Đang chuẩn bị thư viện đọc QR...
</div>

<div class="note">
Đưa mã QR vào khung camera. Hệ thống tự động nhận diện,
phát tiếng bíp và chuyển sang trang tra cứu.
</div>

</div>

<script>
const WEB_APP_URL =
'https://script.google.com/macros/s/AKfycbywXvRGwJxCMw8FDcrMQWJ0LRPDjwKJn8zwG6MCaxEz1Jj6QOR7brTNF7LvnFRA2XtbBA/exec';

let qrLibraryReady=false;
let qrScanner=null;
let running=false;
let submitted=false;
let busy=false;
let cameras=[];
let currentCamera=0;
let cameraId=null;

function showStatus(message,type=''){
  const el=document.getElementById('status');
  el.className='status '+type;
  el.textContent=message;
}

// Tải thư viện từ nhiều nguồn dự phòng
function loadLibrary(urls,index=0){
  if(index>=urls.length){
    showStatus(
      'Không tải được thư viện QR từ cả hai máy chủ. Hãy kiểm tra Internet hoặc thử lại sau.',
      'err'
    );
    return;
  }

  showStatus('Đang tải thư viện đọc QR, nguồn '+(index+1)+'...');

  const old=document.getElementById('qrLibrary');
  if(old)old.remove();

  const script=document.createElement('script');
  script.id='qrLibrary';
  script.src=urls[index];

  script.onload=()=>{
    if(typeof Html5Qrcode!=='undefined'){
      qrLibraryReady=true;
      showStatus('Thư viện đã sẵn sàng. Nhấn MỞ CAMERA VÀ QUÉT LIÊN TỤC.','ok');
    }else{
      loadLibrary(urls,index+1);
    }
  };

  script.onerror=()=>{
    loadLibrary(urls,index+1);
  };

  document.head.appendChild(script);
}

loadLibrary([
 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/minified/html5-qrcode.min.js',
 'https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js'
]);

function extractId(raw){
  const value=String(raw||'').trim();

  const first=value.split('|')[0].trim();
  const digits=first.replace(/\D/g,'');

  if(/^\d{12}$/.test(digits))return digits;

  const match=value.match(/(?:^|\D)(\d{12})(?:\D|$)/);
  return match?match[1]:null;
}

function beep(){
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    const audio=new AudioCtx();
    const oscillator=audio.createOscillator();
    const gain=audio.createGain();

    oscillator.frequency.value=1200;
    gain.gain.value=0.15;
    oscillator.connect(gain);
    gain.connect(audio.destination);
    oscillator.start();
    oscillator.stop(audio.currentTime+0.2);
  }catch(e){}
}

function sendToApp(id){
  const form=document.createElement('form');
  form.method='POST';
  form.action=WEB_APP_URL;

  const input=document.createElement('input');
  input.type='hidden';
  input.name='id';
  input.value=id;

  form.appendChild(input);
  document.body.appendChild(form);
  form.submit();
}

function onScanSuccess(decodedText){
  if(submitted)return;

  const id=extractId(decodedText);

  if(!id){
    showStatus('Đã nhận diện QR nhưng không tìm thấy CCCD gồm 12 số.');
    return;
  }

  submitted=true;
  beep();
  showStatus('ĐỌC THÀNH CÔNG CCCD: '+id+'. Đang chuyển trang...','ok');

  stopScanner();
  sendToApp(id);
}

async function startScanner(){
  if(submitted || running)return;

  if(!qrLibraryReady || typeof Html5Qrcode==='undefined'){
    showStatus('Thư viện QR chưa tải được. Hãy tải lại trang và kiểm tra Internet.','err');
    return;
  }

  if(!window.isSecureContext){
    showStatus('Camera yêu cầu trang HTTPS hoặc localhost.','err');
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showStatus('Trình duyệt không hỗ trợ camera. Hãy dùng Chrome hoặc Safari mới nhất.','err');
    return;
  }

  try{
    showStatus('Đang khởi động camera...');

    qrScanner=new Html5Qrcode('reader',{
      verbose:false,
      formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE]
    });

    const config={
      fps:12,
      qrbox:function(width,height){
        const size=Math.floor(Math.min(width,height)*0.78);
        return {width:size,height:size};
      },
      aspectRatio:1.0,
      disableFlip:false
    };

    if(cameraId){
      await qrScanner.start(cameraId,config,onScanSuccess);
    }else{
      await qrScanner.start(
        {facingMode:'environment'},
        config,
        onScanSuccess
      );
    }

    running=true;
    showStatus('Đang quét QR liên tục. Đưa mã QR vào giữa khung hình.','ok');

  }catch(e){
    running=false;
    showStatus('Không mở được camera: '+e.message+
      '. Hãy kiểm tra quyền camera trong trình duyệt.','err');
  }
}

async function stopScanner(){
  if(qrScanner && running){
    try{
      await qrScanner.stop();
      await qrScanner.clear();
    }catch(e){}
  }

  running=false;
  qrScanner=null;
}

async function switchCamera(){
  if(!qrLibraryReady){
    showStatus('Thư viện QR chưa sẵn sàng.');
    return;
  }

  try{
    if(running)await stopScanner();

    cameras=await Html5Qrcode.getCameras();

    if(!cameras || cameras.length===0){
      showStatus('Không tìm thấy camera trên thiết bị.','err');
      return;
    }

    currentCamera=(currentCamera+1)%cameras.length;
    cameraId=cameras[currentCamera].id;

    await startScanner();

  }catch(e){
    showStatus('Không đổi được camera: '+e.message,'err');
  }
}

async function readImage(input){
  const file=input.files && input.files[0];
  if(!file || busy || submitted)return;

  if(!qrLibraryReady){
    showStatus('Thư viện QR chưa sẵn sàng.','err');
    input.value='';
    return;
  }

  busy=true;

  try{
    showStatus('Đang đọc QR từ ảnh...');

    const imageReader=new Html5Qrcode('reader',{
      formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE]
    });

    const result=await imageReader.scanFile(file,true);
    const id=extractId(result);

    if(id){
      submitted=true;
      beep();
      showStatus('ĐỌC THÀNH CÔNG CCCD: '+id,'ok');
      sendToApp(id);
    }else{
      showStatus('QR không chứa CCCD gồm 12 số.','err');
    }

  }catch(e){
    showStatus('Không đọc được QR trong ảnh. Hãy chọn ảnh rõ nét hơn.','err');
  }finally{
    busy=false;
    input.value='';
  }
}
</script>
</body>
</html>
